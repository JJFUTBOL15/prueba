<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>API - JJMOVIES</title>
  <style>
    :root {
      --bg: #0f0c1a;
      --text: #fff;
      --accent: #c00000;
      --card-bg: #1a1626;
      --hover: #2d293b;
    }
    * { margin:0; padding:0; box-sizing:border-box; font-family: 'Segoe UI', sans-serif; }
    body { background: var(--bg); color: var(--text); }
    .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
    .header { text-align: center; margin-bottom: 30px; }
    .header h1 { font-size: 32px; margin-bottom: 10px; color: var(--accent); }
    .search-bar {
      display: flex;
      gap: 10px;
      max-width: 500px;
      margin: 0 auto 20px;
    }
    .search-bar input {
      flex: 1;
      padding: 10px 15px;
      border-radius: 8px;
      border: none;
      background: var(--card-bg);
      color: white;
    }
    .search-bar button {
      padding: 10px 20px;
      border-radius: 8px;
      border: none;
      background: var(--accent);
      color: white;
      cursor: pointer;
    }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 20px; }
    .card {
      background: var(--card-bg);
      border-radius: 10px;
      overflow: hidden;
      cursor: pointer;
      transition: transform 0.2s;
    }
    .card:hover { transform: scale(1.05); }
    .card img { width: 100%; height: 260px; object-fit: cover; }
    .card-info { padding: 10px; font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .badge {
      background: var(--accent);
      color: white;
      padding: 2px 6px;
      border-radius: 4px;
      font-size: 10px;
      margin-left: 5px;
    }
    .modal {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.9);
      display: flex; justify-content: center; align-items: center;
      z-index: 1000;
      display: none;
    }
    .modal-content {
      background: var(--card-bg);
      padding: 25px;
      border-radius: 12px;
      width: 90%;
      max-width: 900px;
      max-height: 90vh;
      overflow-y: auto;
    }
    .modal-header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 20px;
    }
    .modal-close { background: none; border: none; color: white; font-size: 28px; cursor: pointer; }
    .embed-code {
      background: #000;
      padding: 15px;
      border-radius: 8px;
      font-family: monospace;
      font-size: 14px;
      color: #00ff00;
      white-space: pre-wrap;
      margin: 15px 0;
    }
    .preview { text-align: center; margin-top: 15px; }
    .preview img { max-width: 200px; border-radius: 8px; }
    .season-ep { display: flex; gap: 10px; margin: 10px 0; }
    .season-ep input {
      padding: 6px; background: #222; color: white; border: 1px solid #444; border-radius: 4px; width: 80px;
    }
    label { display: block; margin-top: 10px; font-size: 14px; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <h1>🎬 JJMOVIES - API</h1>
      <p>Copia el código iframe para embeber en tu sitio</p>
    </div>

    <div class="search-bar">
      <input type="text" id="search-input" placeholder="Buscar película o serie..." />
      <button id="search-btn">🔍</button>
    </div>

    <div class="grid" id="grid">
      <!-- Las tarjetas se generarán aquí -->
    </div>
  </div>

  <div class="modal" id="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2 id="modal-title">Título</h2>
        <button class="modal-close" id="modal-close">×</button>
      </div>

      <div id="season-controls" style="display:none;">
        <div class="season-ep">
          <div>
            <label>Temporada</label>
            <input type="number" id="season" min="1" value="1">
          </div>
          <div>
            <label>Episodio</label>
            <input type="number" id="episode" min="1" value="1">
          </div>
        </div>
      </div>

      <div class="embed-code" id="embed-code"></div>

      <div class="preview">
        <img id="modal-poster" src="" alt="Poster">
      </div>
    </div>
  </div>

  <script>
    // Tu lista de películas y series (reemplázala con tus IDs reales)
    const contenido = [
      { id: "83533", title: "Zootopia", poster: "https://image.tmdb.org/t/p/w300/6PnHqKzN9XgQYUjWvL7BpJyVrI.jpg", type: "PELI" },
      { id: "1084242", title: "Zootopia 2", poster: "https://image.tmdb.org/t/p/w300/hGw7DxuS9CkEzRm41314lY59Z7o.jpg", type: "PELI" },
      { id: "66732", title: "Stranger Things", poster: "https://image.tmdb.org/t/p/w300/49WJfeN0moxb9IPfFrTwy4djT7Y.jpg", type: "SERIE" },
      { id: "66733", title: "Westworld", poster: "https://image.tmdb.org/t/p/w300/7Kx53K5QjKz2Xa35XV004607845.jpg", type: "SERIE" },
      { id: "66734", title: "Black Mirror", poster: "https://image.tmdb.org/t/p/w300/j4J800a25X062Q0K74016485011.jpg", type: "SERIE" },
      { id: "83534", title: "Avatar: Fuego y ceniza", poster: "https://image.tmdb.org/t/p/w300/5YrMv73s864Q848Z7Kj3Zz71j2i.jpg", type: "PELI" },
      { id: "83535", title: "Demon Slayer", poster: "https://image.tmdb.org/t/p/w300/mi47Y328G3Z7A66466048934547.jpg", type: "SERIE" },
      { id: "83536", title: "La Empleada", poster: "https://image.tmdb.org/t/p/w300/1j34Q43Y43528281499Z0a301Xs.jpg", type: "PELI" }
    ];

    // DOM Elements
    const grid = document.getElementById('grid');
    const modal = document.getElementById('modal');
    const modalTitle = document.getElementById('modal-title');
    const modalClose = document.getElementById('modal-close');
    const embedCode = document.getElementById('embed-code');
    const modalPoster = document.getElementById('modal-poster');
    const seasonControls = document.getElementById('season-controls');
    const seasonInput = document.getElementById('season');
    const episodeInput = document.getElementById('episode');
    const searchInput = document.getElementById('search-input');
    const searchBtn = document.getElementById('search-btn');

    // Funciones
    function renderContent(items) {
      grid.innerHTML = '';
      if (items.length === 0) {
        grid.innerHTML = '<p style="color:white; text-align:center; width:100%;">No se encontraron resultados.</p>';
        return;
      }
      items.forEach(item => {
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <img src="${item.poster}" alt="${item.title}" />
          <div class="card-info">
            <span class="card-title">${item.title}</span>
            <span class="badge">${item.type}</span>
          </div>
        `;
        card.addEventListener('click', () => openModal(item));
        grid.appendChild(card);
      });
    }

    function openModal(item) {
      modalTitle.textContent = item.title;
      modalPoster.src = item.poster;

      if (item.type === "SERIE") {
        seasonControls.style.display = 'flex';
        embedCode.textContent = `<iframe class="aspect-video w-full" src="https://jjmovies.lat/sris.html?serie=${item.id}/1/1" frameborder="0" allowfullscreen></iframe>`;
      } else {
        seasonControls.style.display = 'none';
        embedCode.textContent = `<iframe class="aspect-video w-full" src="https://jjmovies.lat/player.html?id=${item.id}" frameborder="0" allowfullscreen></iframe>`;
      }

      modal.style.display = 'flex';
    }

    function closeModal() {
      modal.style.display = 'none';
    }

    function searchContent(query) {
      if (!query.trim()) {
        renderContent(contenido);
        return;
      }
      const filtered = contenido.filter(item =>
        item.title.toLowerCase().includes(query.toLowerCase())
      );
      renderContent(filtered);
    }

    // Event Listeners
    modalClose.addEventListener('click', closeModal);
    searchBtn.addEventListener('click', () => searchContent(searchInput.value));
    searchInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter') searchContent(searchInput.value);
    });

    // Inicialización
    renderContent(contenido);
  </script>
</body>
</html>
