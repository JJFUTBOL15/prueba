<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>JJMOVIES - API</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { background: #0b1120; color: #cbd5e1; font-family: 'Inter', sans-serif; margin: 0; overflow-x: hidden; }
    #app * { box-sizing: border-box; }
    .code-font { font-family: 'JetBrains Mono', monospace; }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: #0f172a; }
    ::-webkit-scrollbar-thumb { background: #c00000; border-radius: 4px; }
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.9); display: none; z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(4px); }
    .modal.active { display: flex; }
    .card { background: #1a1f30; border: 1px solid #2d3748; border-radius: 10px; overflow: hidden; cursor: pointer; transition: transform 0.2s; }
    .card:hover { transform: translateY(-3px); border-color: #c00000; }
    .toast { position: fixed; bottom: 20px; right: 20px; background: #1a202c; border: 1px solid #38a169; color: white; padding: 8px 16px; border-radius: 6px; font-size: 14px; opacity: 0; transition: opacity 0.3s; }
    .toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div id="app" class="min-h-screen p-4 md:p-6">
    <div class="max-w-7xl mx-auto">
      <!-- Header -->
      <div class="flex items-center gap-3 mb-6">
        <div class="w-10 h-10 bg-red-600 rounded-lg flex items-center justify-center">
          <i data-lucide="play" class="text-white w-5 h-5"></i>
        </div>
        <h1 class="text-2xl font-bold text-white">JJ<span class="text-red-500">MOVIES</span> - API</h1>
      </div>

      <!-- Acceso Rápido -->
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-8">
        <div onclick="switchView('movies')" class="p-4 bg-gray-900/50 rounded-xl border border-gray-700 cursor-pointer hover:border-red-500">
          <h3 class="text-white font-medium">Películas</h3>
          <p class="text-gray-400 text-sm">Generar embeds.</p>
        </div>
        <div onclick="switchView('series')" class="p-4 bg-gray-900/50 rounded-xl border border-gray-700 cursor-pointer hover:border-purple-500">
          <h3 class="text-white font-medium">Series</h3>
          <p class="text-gray-400 text-sm">Generar temporadas.</p>
        </div>
      </div>

      <!-- Búsqueda -->
      <div id="search-section" class="mb-6 hidden">
        <div class="flex gap-2">
          <div class="relative flex-1">
            <i data-lucide="search" class="absolute left-3 top-3 text-gray-500 w-4 h-4"></i>
            <input type="text" id="search-input" placeholder="Buscar..." class="w-full bg-gray-900 text-white pl-10 pr-4 py-2 rounded-lg border border-gray-700 focus:border-red-500 focus:outline-none">
          </div>
          <button onclick="handleSearch()" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-lg font-medium">Buscar</button>
        </div>
      </div>

      <!-- Resultados -->
      <div id="results" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-5 gap-4">
        <div class="text-center py-10 text-gray-500">Selecciona una opción arriba.</div>
      </div>
    </div>
  </div>

  <!-- Modal -->
  <div id="modal" class="modal">
    <div class="bg-gray-900 border border-gray-700 w-full max-w-4xl max-h-[90vh] rounded-xl flex flex-col overflow-hidden">
      <div class="flex justify-between items-center p-4 border-b border-gray-800">
        <h3 id="modal-title" class="text-white font-bold">Título</h3>
        <button onclick="closeModal()" class="text-gray-400 hover:text-white"><i data-lucide="x" class="w-5 h-5"></i></button>
      </div>
      <div class="p-4 flex flex-col lg:flex-row gap-6 overflow-y-auto flex-1">
        <!-- Preview -->
        <div class="w-full lg:w-1/2">
          <label class="block text-xs text-gray-400 mb-2">Vista previa</label>
          <div class="aspect-video bg-black rounded-lg overflow-hidden border border-gray-700">
            <div id="preview-iframe" class="w-full h-full"></div>
          </div>
        </div>
        <!-- Config -->
        <div class="w-full lg:w-1/2 space-y-4">
          <!-- Series Controls -->
          <div id="series-controls" class="hidden grid grid-cols-2 gap-3 p-3 bg-gray-800/50 rounded-xl border border-gray-700">
            <div>
              <label class="block text-xs text-gray-500 mb-1">Temporada</label>
              <input type="number" id="season" value="1" min="1" class="w-full bg-gray-900 text-white p-2 rounded border border-gray-700 text-center" oninput="updateEmbed()">
            </div>
            <div>
              <label class="block text-xs text-gray-500 mb-1">Episodio</label>
              <input type="number" id="episode" value="1" min="1" class="w-full bg-gray-900 text-white p-2 rounded border border-gray-700 text-center" oninput="updateEmbed()">
            </div>
          </div>

          <!-- Embed Code -->
          <div>
            <label class="block text-xs text-gray-400 mb-2">Código HTML</label>
            <div class="relative group" onclick="copyEmbed()">
              <code id="embed-code" class="code-font block text-green-400 text-xs break-all bg-gray-950 p-3 rounded border border-gray-800 select-all min-h-[60px] cursor-pointer">...</code>
              <div class="absolute inset-0 flex items-center justify-center opacity-0 group-hover:opacity-100 bg-black/30 transition-opacity">
                <span class="bg-red-600 text-white text-xs px-2 py-1 rounded font-bold">Copiar</span>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Toast -->
  <div id="toast" class="toast">¡Copiado!</div>

  <script>
    const DOMAIN = 'https://jjmovies.lat'; // ✅ TU DOMINIO
    let currentData = { type: 'movie', id: null, title: '', poster: '' };

    lucide.createIcons();

    function switchView(type) {
      document.getElementById('search-section').classList.remove('hidden');
      document.getElementById('search-input').placeholder = type === 'movies' ? 'Buscar película...' : 'Buscar serie...';
      document.getElementById('search-input').dataset.type = type;
    }

    async function handleSearch() {
      const input = document.getElementById('search-input');
      const query = input.value.trim();
      const type = input.dataset.type === 'series' ? 'tv' : 'movie';
      if (!query) return;

      const TMDB_KEY = 'da8b836389708e0558de674492931977';
      const url = `https://api.themoviedb.org/3/search/${type}?api_key=${TMDB_KEY}&language=es-MX&query=${encodeURIComponent(query)}`;

      try {
        const res = await fetch(url);
        const data = await res.json();
        renderResults(data.results, type);
      } catch (e) {
        document.getElementById('results').innerHTML = `<div class="col-span-full text-center text-red-400">Error al buscar.</div>`;
      }
    }

    function renderResults(items, type) {
      const container = document.getElementById('results');
      container.innerHTML = items.map(item => {
        const title = type === 'movie' ? item.title : item.name;
        const poster = item.poster_path ? `https://image.tmdb.org/t/p/w300${item.poster_path}` : 'https://via.placeholder.com/300x450/1e293b/475569?text=Sin+img';
        return `
          <div class="card" onclick="openModal('${type}', '${item.id}', '${title.replace(/'/g, "\\'")}', '${poster}')">
            <img src="${poster}" class="w-full aspect-[2/3] object-cover" />
            <div class="p-2">
              <h4 class="text-white text-xs font-medium truncate">${title}</h4>
              <span class="text-[8px] bg-red-600 text-white px-1.5 py-0.5 rounded uppercase">${type === 'movie' ? 'PELI' : 'SERIE'}</span>
            </div>
          </div>
        `;
      }).join('');
      lucide.createIcons();
    }

    function openModal(type, id, title, poster) {
      currentData = { type, id, title, poster };
      document.getElementById('modal-title').textContent = title;
      document.getElementById('series-controls').classList.toggle('hidden', type === 'movie');
      updateEmbed();
      document.getElementById('modal').classList.add('active');
    }

    function updateEmbed() {
      const { type, id } = currentData;
      let url = '';
      if (type === 'movie') {
        url = `${DOMAIN}/player.html?id=${id}`;
      } else {
        const s = document.getElementById('season').value;
        const e = document.getElementById('episode').value;
        url = `${DOMAIN}/sris.html?serie=${id}/${s}/${e}`;
      }

      const iframeHtml = `<iframe class="aspect-video w-full" src="${url}" frameborder="0" allowfullscreen></iframe>`;
      document.getElementById('embed-code').textContent = iframeHtml;

      // Vista previa
      const iframe = document.createElement('iframe');
      iframe.src = url;
      iframe.allowFullscreen = true;
      iframe.style.width = '100%';
      iframe.style.height = '100%';
      iframe.style.border = 'none';
      document.getElementById('preview-iframe').innerHTML = '';
      document.getElementById('preview-iframe').appendChild(iframe);
    }

    function closeModal() {
      document.getElementById('modal').classList.remove('active');
    }

    function copyEmbed() {
      const code = document.getElementById('embed-code').textContent;
      navigator.clipboard.writeText(code).then(() => {
        const toast = document.getElementById('toast');
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
      });
    }

    // Permitir Enter en búsqueda
    document.getElementById('search-input').addEventListener('keypress', (e) => {
      if (e.key === 'Enter') handleSearch();
    });
  </script>
</body>
</html>
